[package]
name = "hitdns"
version = "0.8.0"
edition = "2021"
description = "hitdns is a DNS forward server optimized for cache hit ratio and query latency."
license = "GPL-3.0"
authors = ["Delta4 <delta4chat@gmx.com>", "Your Name <you@example.com>"]
repository = "https://github.com/delta4chat/hitdns"
keywords = ["dns", "dns-over-https", "doh", "cache", "dns-server"]
categories = ["command-line-utilities", "network-programming", "caching", "web-programming::http-server", "web-programming::http-client"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]

[dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["atomic-polyfill", "compile-time-rng"] }
async-channel = "2.3.1"
asyncute = { version = "0.0.5", default-features = false, features = ["crossbeam-channel"] }
bytes = "1.10.1"
country-code-enum = "0.2.0"
event-listener = { version = "5.4.0", features = ["portable-atomic"] }
h2 = { version = "0.4.10", default-features = false }
heapless = { version = "0.8.0", features = ["portable-atomic"] }
hickory-proto = { version = "0.24.4", default-features = false, features = ["dnssec"] }
http-types = { version = "2.12.0", default-features = false }
log = { version = "0.4.27", features = ["std"] }
moka = { version = "0.12.10", features = ["future"] }
once_cell = { version = "1.21.3", features = ["portable-atomic", "parking_lot"] }
parking = "2.2.1"
portable-atomic = { version = "1.11.0", features = ["std"] }
scc = "2.3.4"
sdd = "3.0.8"
sled = { version = "0.34.7", features = ["lock_free_delays", "compression", "backtrace"] }
smoltimeout = "0.6.3"

# TODO publish once this crate from alpha stage to beta
non-tokio = { path = "../toolset/non-tokio" }
async-net = "2.0.0"
futures-rustls = { version = "0.26.0", default-features = false, features = ["logging"] }
async-io = "2.4.1"
anypki = "0.2.0"
mozilla-root-ca = { version = ">=0.0.0", features = ["std", "rustls"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-webpki = "0.103.3"
http = "1.3.1"

[build-dependencies]

[profile.dev]
panic = "unwind"
opt-level = 2
lto = "off"
#strip = "none"
codegen-units = 256
overflow-checks = true
debug-assertions = true
debug = "limited"
incremental = true

[profile.release]
panic = "unwind"
opt-level = 3
lto = true
strip = true
codegen-units = 1
overflow-checks = true
debug-assertions = false
debug = 1
incremental = false


